# Increase memory for Gradle daemon to prevent OutOfMemoryError
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
# Fix for KSP cache corruption issue: "Storage for ... is already registered"
# This disables incremental compilation for KSP which avoids the cache conflict.
ksp.incremental=false
# Enable AndroidX
android.useAndroidX=true
# Performance improvements
android.dependency.useConstraints=false
